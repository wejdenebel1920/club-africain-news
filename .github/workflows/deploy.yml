name: Update & Deploy Club Africain News

on:
  schedule:
    # Actualisation automatique toutes les 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run free RSS & YouTube collector (PowerShell)
        shell: pwsh
        run: ./scripts/collect.ps1

      - name: Commit updated news data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news.js public/data/news.json public/data/news.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Club Africain football news [skip ci]"
            git push
          fi

      - name: Upload static site artifact (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
